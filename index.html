<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de Memoria</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 800px;
            width: 100%;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
            font-size: 32px;
        }

        .game-info {
            display: flex;
            justify-content: space-around;
            margin-bottom: 30px;
            gap: 20px;
        }

        .info-card {
            background: linear-gradient(135deg, #f8f9ff 0%, #f0f2ff 100%);
            padding: 15px 25px;
            border-radius: 15px;
            text-align: center;
            flex: 1;
            border-left: 4px solid #667eea;
        }

        .info-label {
            color: #666;
            font-size: 14px;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .info-value {
            color: #333;
            font-size: 24px;
            font-weight: 700;
            color: #667eea;
        }

        .memory-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .memory-card {
            aspect-ratio: 1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            cursor: pointer;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .memory-card:hover {
            transform: scale(1.05);
        }

        .memory-card.flipped {
            transform: rotateY(180deg);
        }

        .memory-card.matched {
            opacity: 0.6;
            cursor: default;
        }

        .memory-card.matched:hover {
            transform: none;
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 15px;
        }

        .card-front {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-size: 48px;
        }

        .card-back {
            background: white;
            transform: rotateY(180deg);
            font-size: 48px;
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.3s ease-in;
        }

        .modal.show {
            display: flex;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
            animation: scaleIn 0.4s ease-out;
        }

        @keyframes scaleIn {
            from {
                transform: scale(0.8);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .modal-content h2 {
            color: #667eea;
            font-size: 32px;
            margin-bottom: 20px;
        }

        .modal-content .trophy {
            font-size: 80px;
            margin-bottom: 20px;
        }

        .modal-stats {
            background: #f8f9ff;
            padding: 20px;
            border-radius: 15px;
            margin: 20px 0;
        }

        .modal-stat {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            font-size: 18px;
        }

        .modal-stat strong {
            color: #667eea;
        }

        @media (max-width: 768px) {
            .game-container {
                padding: 20px;
            }

            h1 {
                font-size: 24px;
            }

            .memory-board {
                gap: 10px;
            }

            .card-front, .card-back {
                font-size: 36px;
            }

            .game-info {
                flex-direction: column;
            }

            .controls {
                flex-direction: column;
            }
        }

        @media (max-width: 480px) {
            .card-front, .card-back {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🧠 Juego de Memoria</h1>

        <div class="game-info">
            <div class="info-card">
                <div class="info-label">Movimientos</div>
                <div class="info-value" id="moves">0</div>
            </div>
            <div class="info-card">
                <div class="info-label">Tiempo</div>
                <div class="info-value" id="timer">00:00</div>
            </div>
            <div class="info-card">
                <div class="info-label">Pares Encontrados</div>
                <div class="info-value" id="pairs">0/8</div>
            </div>
        </div>

        <div class="memory-board" id="game-board">
            <!-- Las cartas se generarán dinámicamente con JavaScript -->
        </div>

        <div class="controls">
            <button class="btn btn-primary" onclick="startNewGame()">Nuevo Juego</button>
            <button class="btn btn-secondary" onclick="resetGame()">Reiniciar</button>
        </div>
    </div>

    <div class="modal" id="victory-modal">
        <div class="modal-content">
            <div class="trophy">🏆</div>
            <h2>¡Felicidades!</h2>
            <p style="color: #666; margin-bottom: 20px;">¡Has completado el juego!</p>
            <div class="modal-stats">
                <div class="modal-stat">
                    <span>Movimientos:</span>
                    <strong id="final-moves">0</strong>
                </div>
                <div class="modal-stat">
                    <span>Tiempo:</span>
                    <strong id="final-time">00:00</strong>
                </div>
            </div>
            <button class="btn btn-primary" onclick="startNewGame()">Jugar de Nuevo</button>
        </div>
    </div>

    <script>
        // Emojis para las cartas
        const cardSymbols = ['🎮', '🎨', '🎭', '🎪', '🎯', '🎲', '🎸', '🎺'];

        let cards = [];
        let flippedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let timer = 0;
        let timerInterval = null;
        let gameStarted = false;

        function initGame() {
            // Crear pares de cartas y mezclarlas
            cards = [...cardSymbols, ...cardSymbols];
            shuffleArray(cards);

            // Resetear variables
            flippedCards = [];
            matchedPairs = 0;
            moves = 0;
            timer = 0;
            gameStarted = false;

            // Actualizar UI
            updateUI();
            renderBoard();

            // Detener timer si está corriendo
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function renderBoard() {
            const board = document.getElementById('game-board');
            board.innerHTML = '';

            cards.forEach((symbol, index) => {
                const card = document.createElement('div');
                card.className = 'memory-card';
                card.dataset.index = index;
                card.dataset.symbol = symbol;
                card.onclick = () => flipCard(index);

                card.innerHTML = `
                    <div class="card-front">❓</div>
                    <div class="card-back">${symbol}</div>
                `;

                board.appendChild(card);
            });
        }

        function flipCard(index) {
            // Iniciar timer en el primer movimiento
            if (!gameStarted) {
                startTimer();
                gameStarted = true;
            }

            const card = document.querySelector(`[data-index="${index}"]`);

            // No permitir voltear si ya hay 2 cartas volteadas o si la carta ya está emparejada
            if (flippedCards.length >= 2 || card.classList.contains('flipped') || card.classList.contains('matched')) {
                return;
            }

            // Voltear carta
            card.classList.add('flipped');
            flippedCards.push({ index, symbol: card.dataset.symbol, element: card });

            // Comprobar si hay 2 cartas volteadas
            if (flippedCards.length === 2) {
                moves++;
                updateUI();
                checkMatch();
            }
        }

        function checkMatch() {
            const [card1, card2] = flippedCards;

            if (card1.symbol === card2.symbol) {
                // ¡Pareja encontrada!
                setTimeout(() => {
                    card1.element.classList.add('matched');
                    card2.element.classList.add('matched');
                    matchedPairs++;
                    updateUI();
                    flippedCards = [];

                    // Comprobar si el juego ha terminado
                    if (matchedPairs === cardSymbols.length) {
                        endGame();
                    }
                }, 500);
            } else {
                // No coinciden, voltear de nuevo
                setTimeout(() => {
                    card1.element.classList.remove('flipped');
                    card2.element.classList.remove('flipped');
                    flippedCards = [];
                }, 1000);
            }
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timer++;
                updateUI();
            }, 1000);
        }

        function updateUI() {
            document.getElementById('moves').textContent = moves;
            document.getElementById('pairs').textContent = `${matchedPairs}/${cardSymbols.length}`;

            const minutes = Math.floor(timer / 60);
            const seconds = timer % 60;
            document.getElementById('timer').textContent =
                `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        function endGame() {
            clearInterval(timerInterval);

            // Mostrar modal de victoria
            document.getElementById('final-moves').textContent = moves;
            document.getElementById('final-time').textContent = document.getElementById('timer').textContent;
            document.getElementById('victory-modal').classList.add('show');
        }

        function startNewGame() {
            document.getElementById('victory-modal').classList.remove('show');
            initGame();
        }

        function resetGame() {
            if (confirm('¿Estás seguro de que quieres reiniciar el juego?')) {
                initGame();
            }
        }

        // Inicializar el juego al cargar la página
        initGame();
    </script>
</body>
</html>
